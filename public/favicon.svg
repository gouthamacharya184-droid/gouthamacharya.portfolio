<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient matching the theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="100%" stop-color="#080e1c"/>
    </linearGradient>

    <!-- Theme Gradients (Cyan to Purple) -->
    <linearGradient id="themeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#themeGrad)" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Glowing Brain & Neural Network Asset -->
  <g transform="translate(12, 12)" filter="url(#glow)">
    <!-- Left Brain (Organic / Silhouette) -->
    <path d="M20 40 C10 40, 6 36, 6 30 C6 27, 8 25, 6 22 C4 18, 6 12, 12 10 C15 9, 17 11, 20 10 C20 10, 20 40, 20 40 Z" fill="url(#themeGrad)" opacity="0.85"/>
    
    <!-- Right Brain (Neural Network / Circuit Nodes) -->
    <!-- Connection Lines -->
    <path d="M20 10 L28 12 L34 20 L27 28 L20 30" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 20 L27 28 L32 36 L20 40" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 12 L27 28" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M34 20 L32 36" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Nodes / Dots -->
    <circle cx="28" cy="12" r="3.5" fill="#22d3ee"/>
    <circle cx="34" cy="20" r="3.5" fill="#22d3ee"/>
    <circle cx="27" cy="28" r="3.5" fill="#3b82f6"/>
    <circle cx="32" cy="36" r="3.5" fill="#a855f7"/>
    
    <!-- Center Line nodes -->
    <circle cx="20" cy="10" r="2.5" fill="#3b82f6"/>
    <circle cx="20" cy="20" r="2.5" fill="#3b82f6"/>
    <circle cx="20" cy="30" r="2.5" fill="#a855f7"/>
    <circle cx="20" cy="40" r="2.5" fill="#a855f7"/>
  </g>
</svg>
