services:
  - type: web
    name: goutham-portfolio-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm --prefix frontend run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is intentionally omitted — Render assigns it dynamically.
      # Hardcoding PORT causes health check failures on the free tier.
      - key: FRONTEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      # SMTP (optional) — set these in Render dashboard to enable contact emails
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false
      # Social links
      - key: WHATSAPP_NUMBER
        sync: false
      - key: PHONE_NUMBER
        sync: false
      - key: GITHUB_URL
        sync: false
