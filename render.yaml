services:
  - type: web
    name: goutham-portfolio-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm --prefix backend install
    startCommand: node backend/api/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://gouthamacharya.vercel.app
      - key: WHATSAPP_NUMBER
        value: "7619573468"
      - key: GITHUB_URL
        value: https://github.com/gouthamacharya184-droid
      # --- Set these manually in Render Dashboard → Environment ---
      # GROQ_API_KEY   : Your Groq API key from https://console.groq.com/keys
      # JWT_SECRET     : Generate with: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      # ADMIN_API_KEY  : Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # SMTP_HOST      : smtp.gmail.com
      # SMTP_PORT      : 465
      # SMTP_SECURE    : true
      # SMTP_USER      : your-gmail@gmail.com
      # SMTP_PASS      : your-gmail-app-password
      # RECIPIENT_EMAIL: your-gmail@gmail.com
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
