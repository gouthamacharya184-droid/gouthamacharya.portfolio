<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <!-- favicon.svg is not present; only .png and .ico are served -->
  <link rel="icon" type="image/png" href="/favicon.png?v=4" />
  <link rel="shortcut icon" href="/favicon.png?v=4" />
  <link rel="apple-touch-icon" href="/favicon.png?v=4" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#010614" />

  <!-- Preload LCP image (profile photo in Hero) — reduces LCP time significantly -->
  <!-- In production the image is served from the Render backend, not the Vercel frontend -->
  <link rel="preload" as="image" href="https://goutham-portfolio.onrender.com/api/assets/profile.webp" fetchpriority="high" />

  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: blob: https:;
      connect-src 'self' http: https: ws: wss:;
      frame-src 'none';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />

  <!-- SEO -->
  <title>Goutham Acharya | AI &amp; ML Portfolio</title>
  <meta name="description"
    content="Portfolio of Goutham Acharya — AI &amp; Machine Learning student specializing in Python, NLP, LLM evaluation, and real-world AI workflows." />
  <meta name="keywords"
    content="Goutham Acharya, AIML portfolio, Python developer, machine learning, NLP, LLM, prompt engineering, RAG" />
  <meta name="author" content="Goutham Acharya" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://gouthamacharya.dev" />

  <!-- Open Graph -->
  <meta property="og:title" content="Goutham Acharya | AI &amp; ML Portfolio" />
  <meta property="og:description"
    content="AI &amp; Machine Learning student building practical NLP and LLM workflows. Open to internships." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://gouthamacharya.dev" />
  <meta property="og:image" content="https://goutham-portfolio.onrender.com/api/assets/profile.webp" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Goutham Acharya Portfolio" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Goutham Acharya | AI &amp; ML Portfolio" />
  <meta name="twitter:description"
    content="AI &amp; Machine Learning student — Python, NLP, LLMs. Open to internships." />
  <meta name="twitter:image" content="https://goutham-portfolio.onrender.com/api/assets/profile.webp" />

  <!--
      Google Fonts — reduced from 3 families to 2:
      - Inter: body text, UI elements
      - Outfit: headings (h1–h6)
      Dropped "Plus Jakarta Sans" — Outfit covers all heading weights needed.
      display=swap prevents FOUT; preconnect reduces DNS lookup time.
    -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
</head>

<body class="bg-[#010614] text-slate-100 antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
