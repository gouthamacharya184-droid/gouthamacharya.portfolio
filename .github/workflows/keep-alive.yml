name: Render Keep Alive Ping

on:
  schedule:
    # Run every 10 minutes (* /10 * * *) to prevent Render 15-minute free tier spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "Pinging Render Backend Health Endpoint..."
          curl -s -f -X GET "${{ secrets.RENDER_BACKEND_URL || 'https://goutham-portfolio-backend.onrender.com' }}/api/health" || echo "Ping failed or backend warming up"
